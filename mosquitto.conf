# Mosquitto Broker Configuration for Local Development

# Listen on port 1883 across all network interfaces (IPv4)
listener 1883 0.0.0.0

# In Mosquitto 2.0+, allow_anonymous defaults to false.
# Set to true for quick local testing without passwords.
allow_anonymous true

# Logging settings
log_type error
log_type warning
log_type notice
log_type information
log_dest stdout
